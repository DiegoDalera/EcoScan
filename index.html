<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de basura</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Análisis de basura</h1>
        <h2>Subí o elegí una imagen de tu basura</h2>
    </header>
    <main>
        <section class="botones">
            <p>Elegí una opción para subir la foto</p>
            <label class="boton">
                Subir foto
                <input type="file" id="input_galeria" accept="image/*">
            </label>
            <label class="boton">
                Tomar foto
                <input type="file" id="input_camara" accept="image/*" capture="environment">
            </label>
        </section>

        <section class="mostrar_foto">
            <div class="cont_img">
                <img id="vista_previa" alt="Vista previa de la foto a analizar" hidden>
            </div>
            <button type="button" class="boton" id="analizar_foto" disabled>Analizar foto</button>
        </section>

        <section class="info" id="resultado" aria-live="polite">
            <h2>Tu basura es: <span id="resultado_tipo">—</span></h2>
            <p id="resultado_confianza"></p>
            <h3>Cómo reciclar</h3>
            <p id="resultado_reciclar">Subí una foto y tocá "Analizar foto".</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
